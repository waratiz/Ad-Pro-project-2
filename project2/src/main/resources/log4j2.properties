status = warn
name = ArkanoidConfig

# ===== Appenders =====
appender.console.type = Console
appender.console.name = Console
appender.console.target = SYSTEM_OUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{HH:mm:ss} %-5level %c{1}.%M - %msg%n

appender.file.type = File
appender.file.name = File
appender.file.fileName = arkanoid.log
appender.file.append = true
appender.file.layout.type = PatternLayout
appender.file.layout.pattern = %d{yyyy-MM-dd HH:mm:ss} %-5level %c - %msg%n

# ===== Logger ของโปรเจกต์ =====
logger.game.name = se233.project2
logger.game.level = debug
logger.game.additivity = false
logger.game.appenderRef.console.ref = Console
logger.game.appenderRef.file.ref = File

# ===== Root =====
rootLogger.level = warn
rootLogger.appenderRef.console.ref = Console